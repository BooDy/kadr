name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Compile Frontend SPA Bundle
  # =========================================================================
  build-web:
    name: Build Web Client Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build

      - name: Upload web distribution bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-web-dist
          path: web/dist
          retention-days: 1

  # =========================================================================
  # 2. Build Linux Binaries & Packaging (Tarball + Debian .deb)
  # =========================================================================
  build-linux-packages:
    name: Package Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [build-web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            use_cross: false
          - target: aarch64-unknown-linux-musl
            arch: arm64
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Download web distribution bundle
        uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: web/dist

      # Native x86_64 musl compilation
      - name: Install musl-tools (Native x86_64)
        if: ${{ !matrix.use_cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build native static musl binary
        if: ${{ !matrix.use_cross }}
        run: cargo build -p kadr-server --bin kadr --target ${{ matrix.target }} --release

      # Cross compilation for ARM64 (aarch64) using cross Docker environment
      - name: Install cross tool
        if: ${{ matrix.use_cross }}
        run: |
          mkdir -p ~/.cargo/bin
          curl -L --proto '=https' --tlsv1.2 -sSf \
            "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C ~/.cargo/bin
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build cross static musl binary
        if: ${{ matrix.use_cross }}
        run: cross build -p kadr-server --bin kadr --target ${{ matrix.target }} --release

      - name: Create release distribution packages
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${{ steps.vars.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCH="${{ matrix.arch }}"
          BIN_PATH="target/${TARGET}/release/kadr"
          mkdir -p dist

          # 1. Build Standalone Linux Tarball (.tar.gz)
          STAGE_DIR="kadr-${TAG}-${TARGET}"
          mkdir -p "${STAGE_DIR}"
          cp "${BIN_PATH}" "${STAGE_DIR}/kadr"
          chmod 0755 "${STAGE_DIR}/kadr"
          cp -r web/dist "${STAGE_DIR}/web"
          cp packaging/systemd/kadr.service "${STAGE_DIR}/kadr.service"
          cp packaging/systemd/kadr.env.example "${STAGE_DIR}/kadr.env.example"
          cp packaging/systemd/kadr.toml.example "${STAGE_DIR}/kadr.toml.example"
          cp packaging/scripts/install.sh "${STAGE_DIR}/install.sh"
          chmod +x "${STAGE_DIR}/install.sh"
          tar -czvf "dist/kadr-${TAG}-${TARGET}.tar.gz" "${STAGE_DIR}"

          # 2. Build Debian Package (.deb)
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh "${BIN_PATH}" web/dist "${VERSION}" "${ARCH}" dist

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  # =========================================================================
  # 3. Publish GitHub Release with Checksums
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-packages]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum kadr* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Kadr ${{ steps.vars.outputs.tag }}"
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.tag, '-rc') || contains(steps.vars.outputs.tag, '-beta') || contains(steps.vars.outputs.tag, '-alpha') }}
