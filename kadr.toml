[server]
host = "0.0.0.0"
port = 8492
data_dir = "./data"

[storage]
database_path = "./data/kadr.db"
max_readers = 4

[scanner]
debounce_millis = 500
use_ffprobe = true

# Defaults only: values saved from the web UI (Administration > Plugins) take precedence.
[plugins]
enabled = false
resolve_timeout_secs = 5
allow_private_proxy = false

[storyboard]
enabled = true
max_concurrent = 1
interval_secs = 10
tile_width = 320
generate_on_scan = false

