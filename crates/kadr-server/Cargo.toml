[package]
name = "kadr-server"
version = "0.1.0"
edition = "2021"
autotests = true

[lib]
name = "kadr_server"
path = "src/lib.rs"

[[bin]]
name = "kadr"
path = "src/main.rs"

[[test]]
name = "e2e_streaming_auth_test"
path = "../../tests/e2e_streaming_auth_test.rs"

[[test]]
name = "e2e_widget_ast_test"
path = "../../tests/e2e_widget_ast_test.rs"

[[test]]
name = "e2e_subtitles_test"
path = "../../tests/e2e_subtitles_test.rs"

[[test]]
name = "e2e_events_telemetry_test"
path = "../../tests/e2e_events_telemetry_test.rs"

[[test]]
name = "e2e_web_serving_test"
path = "../../tests/e2e_web_serving_test.rs"

[dependencies]
kadr-core = { path = "../kadr-core" }
kadr-storage = { path = "../kadr-storage" }
kadr-ingest = { path = "../kadr-ingest" }
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
argon2 = "0.5"
rand = "0.8"
jsonwebtoken = "9.3"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2.1.3"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "macros"] }
tempfile = "3.17"
http-body-util = "0.1"

